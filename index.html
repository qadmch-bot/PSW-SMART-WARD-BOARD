<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>PSW Ward Board</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Cairo:wght@500;700;800&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="tv">
  <div id="viewport">
    <div id="stage" aria-live="off">

      <header class="hdr">
        <div class="brand">
          <div class="logo-slot"><img id="logo" src="assets/logo-placeholder.png" alt="Hospital logo"></div>
          <div class="brand-text">
            <div class="ar brand-ar" id="hospitalNameAr"></div>
            <div class="brand-en" id="hospitalName"></div>
            <div class="brand-cluster" id="cluster"></div>
          </div>
        </div>
        <div class="title">
          <h1 id="deptName"></h1>
          <div class="ar title-ar" id="deptNameAr"></div>
        </div>
        <div class="tagline" id="tagline"></div>
        <div class="clock">
          <div class="clock-date" id="clockDate">&nbsp;</div>
          <div class="clock-time" id="clockTime">&nbsp;</div>
        </div>
      </header>

      <section class="kpis" id="kpis"></section>

      <main class="ward" id="ward"></main>

      <aside class="side">
        <section class="panel summary">
          <h2 id="h-summary"></h2>
          <div id="summary"></div>
        </section>
        <section class="panel oncall">
          <h2 id="h-oncall"></h2>
          <div id="oncall"></div>
        </section>
        <section class="emergency" id="emergency"></section>
      </aside>

      <footer class="ftr">
        <div class="legend" id="legend"></div>
        <div class="sync" id="sync"></div>
      </footer>

      <div class="conn-banner" id="connBanner" role="status" hidden></div>
    </div>
  </div>
  <div class="fs-hint" id="fsHint">Press F or double-click for full screen</div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
